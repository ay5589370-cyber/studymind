<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login | NexoraAI</title>

  <link rel="stylesheet" href="style.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body class="auth-page">
  <nav>
    <div class="logo brand-logo">
      <img
        src="nexoralogo.png"
        alt="NexoraAI logo"
      />
      <span>
        NexoraAI
      </span>
    </div>

    <ul class="nav-links">
      <li>
        <a href="index.html">
          Home
        </a>
      </li>

      <li>
        <a href="index.html#features">
          Features
        </a>
      </li>

      <li>
        <a href="login.html">
          Login/Register
        </a>
      </li>
    </ul>
  </nav>

  <main class="auth-main">
    <section class="auth-panel">
      <div class="auth-copy">
        <span class="auth-kicker">
          Secure study workspace
        </span>

        <h1>
          Sign in to keep your study history organized
        </h1>

        <p>
          Create an account or continue with Google to save generated explanations, recent activity, and your personal learning progress.
        </p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button
            class="auth-tab active"
            id="loginTab"
            type="button"
          >
            Login
          </button>

          <button
            class="auth-tab"
            id="registerTab"
            type="button"
          >
            Register
          </button>
        </div>

        <form id="authForm">
          <div
            class="form-group register-only"
            id="nameGroup"
          >
            <label for="userName">
              Full Name
            </label>

            <input
              id="userName"
              type="text"
              placeholder="Your full name"
            />
          </div>

          <div class="form-group">
            <label for="userEmail">
              Email address
            </label>

            <input
              id="userEmail"
              type="email"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="userPassword">
              Password
            </label>

            <input
              id="userPassword"
              type="password"
              placeholder="At least 6 characters"
              minlength="6"
              required
            />
          </div>

          <button
            class="auth-submit"
            id="authSubmit"
            type="submit"
          >
            Login
          </button>
        </form>

        <div class="auth-divider">
          <span></span>
          <p>or</p>
          <span></span>
        </div>

        <button
          class="google-btn"
          id="googleLogin"
          type="button"
        >
          <i class="fa-brands fa-google"></i>
          Continue with Google
        </button>

        <p
          class="auth-message"
          id="authMessage"
        ></p>
      </div>
    </section>
  </main>

  <script src="env-config.js"></script>

  <script type="module" src="login.js"></script>
</body>

</html>
